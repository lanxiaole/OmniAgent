appId: com.omniagent.app
productName: OmniAgent
directories:
  output: release                    # 安装包输出到 desktop/release/

files:
  - dist/main/**/*                    # tsc 编译产物（主进程）
  - dist/preload/**/*                 # tsc 编译产物（预加载脚本）
  - dist/frontend/**/*                # Vue 前端编译产物
  - node_modules/**/*

extraResources:
  - from: dist/backend/               # PyInstaller 打包后的 exe
    to: backend/                      # 安装后放到 resources/backend/ 下
    filter: ["**/*"]

win:
  target:
    - nsis        # 安装版：一键安装 + 桌面/开始菜单快捷方式
    - portable    # 绿色便携版：双击即用，无需安装
  icon: resources/icons/icon.ico

nsis:
  perMachine: true
  allowToChangeInstallationDirectory: true  # 允许用户选择安装位置
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target: dmg
  icon: resources/icons/icon.icns

linux:
  target: AppImage
  icon: resources/icons/
  category: Utility